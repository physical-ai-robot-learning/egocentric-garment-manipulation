name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install "opencv-python-headless<5"   # camera <-> robot solver self-test (needs calibrateRobotWorldHandEye, gone in 5.0)
      - name: Compile (whole repository)
        run: python -m compileall -q .
      - name: Test (egogarment synthetic regression, layout smoke tests, import smoke test of every module under src/)
        run: python -m pytest -q -rs
      - name: Self-test, replay parity scorer (synthetic)
        run: python scripts/evaluation/replay_parity.py --synthetic | tee /dev/stderr | grep -q PASS
      - name: Self-test, camera <-> robot solver (synthetic)
        run: python scripts/pose/robot_cam_solve.py --synthetic | tee /dev/stderr | grep -q PASS
      - name: Pipeline entry points parse (python -m garment_pipeline...)
        run: |
          for m in labels_dataset.tag_rig_unsplit labels_dataset.tag_rig_to_lerobot labels_dataset.robotize_ik eval_deploy.height_calib; do
            python -m garment_pipeline.$m --help > /dev/null
          done
