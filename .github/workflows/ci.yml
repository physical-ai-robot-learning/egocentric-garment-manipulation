name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # The characterization goldens compare floats exactly; they were recorded on Apple Silicon with the package versions
    # pinned in configs/laundry/envs/requirements-test.txt, so CI runs the same platform and versions.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pinned test environment; the package itself without re-resolving its dependencies)
        run: |
          brew install ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r configs/laundry/envs/requirements-test.txt
          python -m pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src scripts tests analysis
      - name: Claims check (every number in report/report_en.tex vs. the repository file it comes from)
        run: python analysis/verify_claims.py
      - name: Test (characterization tests of every package, layout / import smoke tests, deploy UI routes)
        run: python -m pytest -q -rs
      - name: Self-test, replay parity scorer (synthetic)
        run: python scripts/laundry/eval/replay_parity.py --synthetic | tee /dev/stderr | grep -q PASS
      - name: Self-test, camera <-> robot solver (synthetic)
        run: python -m laundry_tracking.calib.robot_cam_solve --synthetic | tee /dev/stderr | grep -q PASS
      - name: Pipeline entry points parse (python -m laundry_...)
        run: |
          for m in laundry_dataset.tag_rig_unsplit laundry_dataset.tag_rig_to_lerobot laundry_dataset.robotize_ik \
                   laundry_deploy.tools.height_calib laundry_tracking.new_take_prep laundry_grasp.events; do
            python -m $m --help > /dev/null || { echo "FAIL $m"; exit 1; }
          done
