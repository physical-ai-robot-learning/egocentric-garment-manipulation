[project]
name = "egocentric-garment-manipulation"
version = "0.3.0"
description = "Hand-worn-gripper (HandUMI) T-shirt demonstrations -> fixed-camera pose fusion -> reBot training labels, DiT training and two-arm deployment"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Jeong Hwan Lee" }]
requires-python = ">=3.12"
# Base = what the laundry packages need at import time. Machine- and GPU-specific pieces are dependency groups below.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    # <5: cv2.calibrateRobotWorldHandEye is gone in 5.0 (laundry_tracking.calib). One OpenCV distribution per environment.
    "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]          # pip users: pip install -e ".[test]" (uv users: the dev group)

[project.urls]
Repository = "https://github.com/physical-ai-robot-learning/egocentric-garment-manipulation"

[project.scripts]
laundry-reference-gap-fill = "laundry_reference.cli:gap_fill"
laundry-reference-relative-se3 = "laundry_reference.cli:relative_se3"
laundry-reference-robotize = "laundry_reference.cli:robotize"
laundry-reference-parity-metrics = "laundry_reference.cli:parity_metrics"
laundry-reference-plot-example = "laundry_reference.cli:plot_example"

[dependency-groups]
# laundry_tracking CoTracker stage (CUDA node) and laundry_jaw models
vision = ["torch>=2.4", "torchvision>=0.19", "ultralytics>=8.3"]
# IK labels (laundry_dataset.robotize_ik, sub-process EGO_IK_PYTHON) and the deploy / robot bridge
robot = ["pin>=3.4", "pin-pink>=3.1", "requests>=2.31", "flask>=3.0"]
# laundry_training: the DiT / ACT trainer runs on the LeRobot fork of the training nodes (lerobot multi-task DiT, diffusers,
# accelerate); that fork is installed by hand there and is not on PyPI in the version used (configs/laundry/envs/requirements-train.txt).
train = ["torch>=2.4", "torchvision>=0.19", "diffusers>=0.30", "accelerate>=0.33", "safetensors>=0.4"]
# laundry_shared collector / recorder modules (tag_rig_record, umi_jaw capture, mcap readers)
collector = ["pyserial>=3.5", "feetech-servo-sdk>=1.0.0", "av>=12", "mcap>=1.2", "tqdm>=4.66", "pupil-apriltags>=1.0.4"]
dev = ["pytest>=8.0"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/laundry_common",
    "src/laundry_shared",
    "src/laundry_jaw",
    "src/laundry_tracking",
    "src/laundry_dataset",
    "src/laundry_training",
    "src/laundry_deploy",
    "src/laundry_reference",
]

[tool.pytest.ini_options]
# Files named *_test.py under src/laundry_shared and archive/ are hardware tools, not pytest tests.
testpaths = [
    "tests/laundry",
    "src/laundry_jaw/tests",
    "src/laundry_tracking/tests",
    "src/laundry_dataset/tests",
    "src/laundry_training/tests",
    "src/laundry_deploy/tests",
    "src/laundry_reference/tests",
]
