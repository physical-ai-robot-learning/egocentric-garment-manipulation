[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "egocentric-garment-manipulation"
version = "0.2.0"
description = "Hand-worn-gripper (UMI-style) T-shirt demonstrations -> robot-feasible trajectories and training labels for two reBot B601-DM arms"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Jeong Hwan Lee" }]
requires-python = ">=3.10"
# Base = what the importable packages need at import time (egogarment, visual_teleop, rebot_prep, most of garment_pipeline).
# Hardware / GPU pieces are extras.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7"]
vision = ["opencv-python<5"]                 # <5: cv2.calibrateRobotWorldHandEye is gone in 5.0; AprilTag / ArUco pose, wrist + Orbbec video (rebot_prep.parity, scripts/pose)
pipeline = ["pandas", "opencv-python<5"]    # garment_pipeline fusion / labels / dataset stages (training + deploy need the LeRobot env: torch, lerobot, diffusers)
robot = ["pin", "pin-pink", "requests"]       # Pink IK + HTTP bridge client (visual_teleop.robot, replay tools)
jaw = ["torch", "ultralytics", "flask"]       # jaw classifier / jaw-tip keypoint training + labelling UI
# The shared packages in src/ (handumi_collector, ego_collector, ego_teleop, umi; identical copies shared with
# egocentric-cube-stacking, docs/provenance.md). Their base needs (numpy, scipy, pyyaml) are the base above; the extras
# below are theirs. One OpenCV wheel per environment: `collector` uses opencv-python (as `vision`), not opencv-contrib-python.
# HandUMI raw collector (handumi_collector): recording, devices, UI
collector = [
    "opencv-python>=4.10,<5",
    "pandas>=2.1",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "mcap>=1.2",
    "pyserial>=3.5",
    "PySide6>=6.7",
    "feetech-servo-sdk>=1.0.0",
    "av>=12",
    "trimesh>=4.0",
]
experimental = ["mediapipe>=0.10.14"]         # ego_collector V0 / ego_teleop hand tracking
apriltag = ["pupil-apriltags>=1.0.4"]
viz = ["rerun-sdk>=0.20"]
# Aero hand branch (ego_teleop/hand3d + retarget/aero_backends): dex_retargeting/DexPilot on the Aero URDF.
# The head RGB-D camera additionally needs `pyorbbecsdk`, installed by hand.
aero = ["dex-retargeting>=0.5,<1"]

[project.urls]
Repository = "https://github.com/physical-ai-vla/egocentric-garment-manipulation"

# Console commands for the egogarment modules that have a command-line interface (main()).
[project.scripts]
egogarment-gap-fill = "egogarment.cli:gap_fill"
egogarment-relative-se3 = "egogarment.cli:relative_se3"
egogarment-robotize = "egogarment.cli:robotize"
egogarment-parity-metrics = "egogarment.cli:parity_metrics"
egogarment-plot-example = "egogarment.cli:plot_example"

# src layout: finds egogarment, garment_pipeline, visual_teleop, rebot_prep, the vendored package contracts and the
# shared packages handumi_collector, ego_collector, ego_teleop and umi (docs/provenance.md).
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["xvla_core", "umi_to_lerobot"]   # vendored single-file modules (docs/provenance.md)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visual_teleop = ["config/*.yaml", "config/*.jsonl", "assets/*.png"]
garment_pipeline = ["eval_deploy/tagrig_ui/page.html"]

[tool.pytest.ini_options]
# Only tests/ is collected. Files named *_test.py under src/ and legacy/ are hardware tools, not pytest tests.
testpaths = ["tests"]
