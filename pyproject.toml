[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "egogarment"
version = "0.1.0"
description = "Generic utilities for bimanual jaw-tip trajectories from egocentric human garment demonstrations (synthetic examples only)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jeong Hwan Lee" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/physical-ai-vla/egocentric-garment-manipulation"

# Console commands for the modules that already have a command-line interface (main()).
[project.scripts]
egogarment-gap-fill = "egogarment.cli:gap_fill"
egogarment-relative-se3 = "egogarment.cli:relative_se3"
egogarment-robotize = "egogarment.cli:robotize"
egogarment-parity-metrics = "egogarment.cli:parity_metrics"
egogarment-plot-example = "egogarment.cli:plot_example"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
